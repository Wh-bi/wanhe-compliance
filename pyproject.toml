[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wanhe-compliance"
version = "0.1.0"
description = "Chinese advertising-law & AI-labeling compliance checks with statutory citations (API client)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Wanhe AI Tools"}]
keywords = ["compliance", "advertising-law", "china", "ai-labeling", "aigc"]
dependencies = ["requests>=2.28"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://wanhetools.top"
Documentation = "https://wanhetools.top/openapi.json"

[project.scripts]
wanhe-compliance = "wanhe_compliance.cli:main"
